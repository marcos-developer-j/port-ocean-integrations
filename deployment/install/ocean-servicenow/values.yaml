# Values de la integración Ocean ServiceNow para el entorno laboratory.
# SIN credenciales: el chart referencia el Secret manual "ocean-servicenow-credentials"
# creado a mano en el namespace port-idp.
port:
  baseUrl: https://api.us.getport.io

# Crea blueprints y mapping por defecto automáticamente en el primer arranque
initializePortResources: true

# Resync programado (minutos)
scheduledResyncInterval: 120

# Credenciales fuera de git: Secret manual creado en el namespace
# Debe contener: OCEAN__PORT__CLIENT_ID, OCEAN__PORT__CLIENT_SECRET,
# OCEAN__INTEGRATION__CONFIG__SERVICENOW_USERNAME, OCEAN__INTEGRATION__CONFIG__SERVICENOW_PASSWORD
# (o SERVICENOW_CLIENT_ID y SERVICENOW_CLIENT_SECRET para OAuth)
secret:
  create: false
  name: ocean-servicenow-credentials

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "500m"

integration:
  identifier: servicenow
  type: servicenow
  eventListener:
    type: POLLING
  config:
    # Claves de config NO sensibles según spec oficial
    servicenowUrl: https://INSTANCE.service-now.com
    # Live events vía Business Rules (requiere pod accesible desde ServiceNow); en laboratorio: false
    enableTablesLiveEventsWebhooks: false
