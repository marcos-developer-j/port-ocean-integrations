# Values de la integración Ocean JFrog para el entorno laboratory.
# SIN credenciales: el chart referencia el Secret manual "ocean-jfrog-credentials"
# creado a mano en el namespace port-idp (ver deployment/README.md, paso Secrets).
port:
  baseUrl: https://api.getport.io

initializePortResources: false
scheduledResyncInterval: 120

# Imagen local construida con scripts/build-and-load.sh (kind la registra bajo docker.io/library)
imageRegistry: docker.io/library
image: "port-ocean-jfrog:local"
imagePullPolicy: Never

# No crear el Secret desde el chart: usar el Secret manual del namespace.
# Debe contener: OCEAN__PORT__CLIENT_ID, OCEAN__PORT__CLIENT_SECRET,
# OCEAN__INTEGRATION__CONFIG__JFROG_ACCESS_TOKEN
secret:
  create: false
  name: ocean-jfrog-credentials

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "500m"

integration:
  identifier: jfrog
  type: jfrog
  eventListener:
    type: POLLING
  config:
    jfrogHostUrl: "https://miempresa.jfrog.io"   # ajustar a la instancia real
