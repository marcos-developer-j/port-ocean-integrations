# Values de la integración Ocean Dynatrace para el entorno laboratory.
# SIN credenciales: el chart referencia el Secret manual "ocean-dynatrace-credentials"
# creado a mano en el namespace port-idp.
port:
  baseUrl: https://api.us.getport.io

# Crea blueprints y mapping por defecto automáticamente en el primer arranque
initializePortResources: true

# Resync programado (minutos)
scheduledResyncInterval: 120

# Credenciales fuera de git: Secret manual creado en el namespace
# Debe contener: OCEAN__PORT__CLIENT_ID, OCEAN__PORT__CLIENT_SECRET,
# OCEAN__INTEGRATION__CONFIG__DYNATRACE_API_KEY
secret:
  create: false
  name: ocean-dynatrace-credentials

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "500m"

integration:
  identifier: dynatrace
  type: dynatrace
  eventListener:
    type: POLLING
  config:
    # Única clave de config NO sensible según spec oficial
    dynatraceHostUrl: https://ENVIRONMENT_ID.live.dynatrace.com
