# Values de la integración Ocean Confluence (custom desarrollada) para el entorno laboratory.
# SIN credenciales: el chart referencia el Secret manual "ocean-confluence-credentials"
# creado a mano en el namespace port-idp.
#
# Esta es una integración CUSTOM DESARROLLADA (código Python propio en integrations/confluence/)
# que convierte el contenido HTML de Confluence a Markdown automáticamente.
port:
  baseUrl: https://api.us.getport.io

# true = carga blueprints y mapping desde .port/resources/ automáticamente
# Los blueprints son: confluenceSpace, confluencePage
initializePortResources: true

# Resync programado (minutos)
scheduledResyncInterval: 120

# Imagen CUSTOM: construida localmente con scripts/build-and-load.sh
# Para producción con Artifact Registry, cambiar a:
#   imageRegistry: us-central1-docker.pkg.dev/PROJECT_ID/port-ocean
#   image: "port-ocean-confluence:0.1.0"
#   imagePullPolicy: IfNotPresent
imageRegistry: docker.io/library
image: "port-ocean-confluence:local"
imagePullPolicy: Never

# Credenciales fuera de git: Secret manual creado en el namespace
# Debe contener:
#   OCEAN__PORT__CLIENT_ID
#   OCEAN__PORT__CLIENT_SECRET
#   OCEAN__INTEGRATION__CONFIG__CONFLUENCE_BASE_URL
#   OCEAN__INTEGRATION__CONFIG__CONFLUENCE_USERNAME
#   OCEAN__INTEGRATION__CONFIG__CONFLUENCE_API_TOKEN
secret:
  create: false
  name: ocean-confluence-credentials

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "500m"

integration:
  identifier: confluence
  type: confluence
  eventListener:
    type: POLLING
  config:
    # La URL base va en el Secret para mayor flexibilidad
    # Tamaño de página para paginación (opcional)
    pageSize: 50
